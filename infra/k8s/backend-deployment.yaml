apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: disaster-relief
spec:
  replicas: 3
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/org/disaster-relief-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: relief-config }
            - secretRef: { name: relief-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
