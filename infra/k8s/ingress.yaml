apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relief-ingress
  namespace: disaster-relief
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts: ["app.disaster-relief.example.com"]
      secretName: relief-tls
  rules:
    - host: app.disaster-relief.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend-service, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend-service, port: { number: 80 } }
