apiVersion: v1
kind: ConfigMap
metadata:
  name: relief-config
  namespace: disaster-relief
data:
  ENVIRONMENT: "production"
  BACKEND_CORS_ORIGINS: "https://app.disaster-relief.example.com"
  MONGODB_DB_NAME: "disaster_relief_platform"
  REDIS_URL: "redis://redis-service:6379/0"
  STORAGE_BACKEND: "s3"
  S3_REGION: "us-east-1"
  ML_INFERENCE_DEVICE: "cpu"
  ENABLE_PROMETHEUS: "true"
