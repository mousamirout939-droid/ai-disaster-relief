  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG secret is empty or not set"
            exit 1
          fi
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$GITHUB_WORKSPACE/kubeconfig"
          if [ ! -s "$GITHUB_WORKSPACE/kubeconfig" ]; then
            echo "::error::Decoded kubeconfig is empty — check that KUBE_CONFIG secret is valid base64"
            exit 1
          fi

      - name: Verify cluster connectivity
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: kubectl cluster-info

      - name: Rollout new images
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          kubectl set image deployment/backend backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n disaster-relief
          kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} -n disaster-relief
          kubectl rollout status deployment/backend -n disaster-relief
          kubectl rollout status deployment/frontend -n disaster-relief