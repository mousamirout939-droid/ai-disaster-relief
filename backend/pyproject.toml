[project]
name = "ai-disaster-relief-platform-backend"
version = "1.0.0"
description = "FastAPI backend for the AI Disaster Relief & Rescue Platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "UP045", # Allow Optional[...] instead of requiring X | None
    "B008",  # Allow FastAPI Depends in function defaults
]

[tool.black]
line-length = 110
target-version = ["py312"]